# Fly.io configuration for the ChipForge API.
# Deploy with: `fly deploy --config apps/api/fly.toml`
#
# First-time setup:
#   fly launch --no-deploy --copy-config --config apps/api/fly.toml
#   fly secrets set JWT_SECRET=... DATABASE_URL=... REDIS_URL=... \
#     S3_ENDPOINT_URL=... S3_ACCESS_KEY=... S3_SECRET_KEY=... \
#     OPENAI_API_KEY=... --config apps/api/fly.toml
#
# Managed Postgres: `fly postgres create` then `fly postgres attach`.

app = "chipforge-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  AI_PROVIDER = "mock"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
